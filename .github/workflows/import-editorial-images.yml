name: Import selected editorial images
on:
  push:
    branches: [runway-asset-import]
    paths: [.github/workflows/import-editorial-images.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --quiet Pillow
      - name: Prepare the selected Runway photos for the site
        env:
          PHOTO_URLS: ${{ secrets.BWE_RUNWAY_ASSETS }}
        run: |
          python - <<'PY'
          import io, json, os, urllib.request
          from PIL import Image
          urls = json.loads(os.environ["PHOTO_URLS"])
          for name in ("rib", "beef", "chicken"):
              try:
                  with urllib.request.urlopen(urls[name], timeout=25) as response:
                      image = Image.open(io.BytesIO(response.read())).convert("RGB")
                  image.thumbnail((1080, 820))
                  image.save("runway-" + name + ".webp", quality=88, method=6)
                  print("Prepared", name, image.size)
              except Exception:
                  raise SystemExit("Download failed for " + name) from None
          try:
              req = urllib.request.Request("https://pub.mdpi-res.com/agriculture/agriculture-14-01091/article_deploy/html/images/agriculture-14-01091-g002.png", headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  photo = Image.open(io.BytesIO(response.read())).convert("RGB")
              photo.thumbnail((1280,1280))
              photo.save("field-footpad.webp", quality=91, method=6)
              print("Prepared licensed field photograph", photo.size)
          except Exception:
              print("Licensed source figure needs a second download route.")
          PY
      - name: Save assets to the preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.webp'
          git commit -m 'Prepare editorial photos for publication'
          git push
